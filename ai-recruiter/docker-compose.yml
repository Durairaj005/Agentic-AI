version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_recruiter_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=AI-Powered Smart Recruitment & Candidate Matching Platform
      - ENVIRONMENT=production
      - SECRET_KEY=smart-recruiter-super-secure-production-jwt-secret-key-32-chars
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://localhost"]
      - DATABASE_URL=sqlite:///./recruitment.db
      - EMBEDDING_MODEL_NAME=all-MiniLM-L6-v2
    volumes:
      - backend_data:/app/storage
      - backend_db:/app
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_recruiter_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
  backend_db:
