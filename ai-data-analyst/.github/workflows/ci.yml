name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── Backend test pipeline ──────────────────────────────────────────────────
  test-backend:
    runs-on: ubuntu-latest

    # Setup MySQL and Redis service containers
    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: ai_data_analyst_test
          MYSQL_USER: analyst_user
          MYSQL_PASSWORD: your_strong_password_here
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository source
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute pytest suite
        env:
          APP_ENV: testing
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: analyst_user
          MYSQL_PASSWORD: your_strong_password_here
          MYSQL_DATABASE: ai_data_analyst_test
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          LLM_PROVIDER: gemini
          LLM_API_KEY: dummy-api-key-for-test-mocks
          LLM_MODEL: gemini-1.5-flash
          SECRET_KEY: test-secret-key-12345-only-for-ci
          JWT_SECRET_KEY: test-secret-key-12345-only-for-ci
        run: |
          pytest backend/tests/ -v

  # ── Frontend build and lint pipeline ───────────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository source
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend requirements
        working-directory: ./frontend
        run: npm ci

      - name: Execute oxlint linter
        working-directory: ./frontend
        run: npm run lint

      - name: Execute production bundler build
        working-directory: ./frontend
        run: npm run build
